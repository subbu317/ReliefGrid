server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/reliefgrid;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  admin-key: ${RELIEFGRID_ADMIN_KEY:local-demo-admin}
  cors-origin: ${RELIEFGRID_CORS_ORIGIN:http://localhost:5173}
